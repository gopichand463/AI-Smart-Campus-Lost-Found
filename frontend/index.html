<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Findly — Smart Campus Lost &amp; Found</title>
    <!-- Google Fonts: Lora (Editorial Serif) & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Lora', 'Georgia', 'serif'],
              sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              findly: {
                bg: '#F6F4EE',
                card: '#FFFFFF',
                border: '#E7E4DC',
                borderLight: '#EDEAE2',
                dark: '#1E3A2F',
                darkHover: '#162C23',
                coral: '#C24136',
                coralLight: '#FCEAE6',
                coralDark: '#8C3A27',
                sage: '#2E5F46',
                sageLight: '#E1EFE6',
                sageDark: '#1E3A2F',
                text: '#1A1D1B',
                muted: '#6C726D',
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#F6F4EE] text-[#1A1D1B] font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
